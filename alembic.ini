# ============================================
# Chai Sutta - Alembic Configuration
# ============================================

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend (ensures app modules are importable)
prepend_sys_path = .

# Timezone for revision creation
# timezone =

# Max length of characters for auto-generated revision id
# truncate_slug_length = 40

# Set to 'true' to emit CREATE TABLE within the migration
# revision_environment = false

# Set to 'true' to search source files recursively
# sourceless = false

# Version path separator; defaults to os
# version_path_separator = os

# Output encoding for migration scripts
output_encoding = utf-8

# Database URL - placeholder, overridden by env.py at runtime
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Run ruff format on new migration files
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# --- Logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
